<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <form action="#">
        <div class="left">
            <div class="box d-flex justify-content-center align-items-center gap-2">
                <i class="fs-2 fa-solid fa-right-to-bracket"></i>
                <h1 class="mb-0 fw-bold">ĐĂNG NHẬP</h1>
            </div>
            <ul class="p-0 mb-0 d-flex justify-content-center gap-4 mt-5">
                <li class="border p-2 rounded-circle"><i class="fa-brands fa-facebook-f"></i></li>
                <li class="border p-2 rounded-circle"><i class="fa-brands fa-google"></i></li>
                <li class="border p-2 rounded-circle"><i class="fa-brands fa-linkedin-in"></i></li>
            </ul>
            <h5 class="mb-0 text-center mt-3">hoặc sử dụng tài khoản của bạn</h5>
            <input id="mail" class="in1 w-100 m-3 border rounded-pill p-2" type="email" placeholder="Email">
            <input id="pword" class="in2 w-100 mx-3 mb-2 border rounded-pill p-2 " type="password" placeholder="Mật khẩu">
            <h6 class="mb-0 text-center mt-3 text-primary">Quên mật khẩu?</h6>
            <button id="nhap">ĐĂNG NHẬP</button>
        </div>
        <div class="right d-flex flex-column justify-content-center align-items-center">
            <h1>Xin chào, Bạn!</h1>
            <p class="mb-0 text-center">Nhập thông tin cá nhân của bạn và bắt đầu hành <br> trình với chúng tôi </p>
            <button>ĐĂNG KÝ</button>
        </div>
    </form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="../js/api.js"></script>
    <script src="../js/login.js"></script>
</body>

</html>
